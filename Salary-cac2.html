<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薪資基數逆推計算器</title>
    <style>
        :root {
            --primary: #2b6cb0;
            --warning: #e53e3e;
            --success: #2f855a;
            --bg: #f7fafc;
        }
        * {
            box-sizing: border-box; /* 確保寬度包含內邊距，絕不超出格子 */
            word-wrap: break-word; /* 強制長文字自動換行 */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: #2d3748;
            padding: 15px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 15px;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 15px;
            background-color: #fff;
            display: block;
        }
        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .hint {
            font-size: 12px;
            color: #718096;
            margin-top: 4px;
            line-height: 1.4;
        }
        .btn-calc {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-calc:hover {
            background-color: #2c5282;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: #ebf8ff;
            border-left: 5px solid var(--primary);
            display: none;
        }
        .result-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #2b6cb0;
        }
        .result-item {
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; /* 超出時自動換行 */
        }
        .result-item span.value {
            font-weight: bold;
            color: #1a202c;
            text-align: right;
        }
        .alert-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.5;
            display: none;
        }
        .alert-danger {
            background-color: #fff5f5;
            color: var(--warning);
            border: 1px solid #fed7d7;
        }
        .alert-success {
            background-color: #f0fff4;
            color: var(--success);
            border: 1px solid #c6f6d5;
        }
        hr {
            border: 0;
            border-top: 1px dashed #cbd5e0;
            margin: 12px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>薪資基數逆推計算器</h2>
    
    <div class="form-group">
        <label for="totalEarn">每月應領總金額 (元)</label>
        <input type="number" id="totalEarn" placeholder="請輸入每月未扣勞健保前之應領總額" required min="0">
        <div class="hint">說明：應領金額 = 實領金額 + 勞健保自負額</div>
    </div>

    <div class="form-group">
        <label for="monthDays">當月總天數</label>
        <select id="monthDays">
            <option value="30" selected>30 天 (一般月份/勞基法基準)</option>
            <option value="31">31 天 (大月：如1、3、5、7、8、10、12月)</option>
        </select>
        <div class="hint">大月會多 1 天出勤，進而影響提前工時累計</div>
    </div>

    <div class="form-group">
        <label for="foodSubsidy">伙食費 (元)</label>
        <input type="number" id="foodSubsidy" value="3000" min="0">
        <div class="hint">內含於月薪基數中，依法計入經常性工資</div>
    </div>

    <div class="form-group">
        <label for="leaveDays">當月實際休假天數 (天)</label>
        <input type="number" id="leaveDays" value="4" min="4" max="8">
        <div class="hint">請輸入 4 到 8 天（預設少休 4 天視為休息日加班）</div>
    </div>

    <div class="form-group">
        <label for="earlyMins">每日提前上班分鐘數</label>
        <input type="number" id="earlyMins" value="30" min="0">
        <div class="hint">計入全月所有出勤日（含平日與例假休息日出勤）</div>
    </div>

    <button class="btn-calc" onclick="calculateSalary()">開始逆推計算</button>

    <div class="alert-box" id="alertBox"></div>

    <div class="result-box" id="resultBox">
        <div class="result-title">📊 逆推計算結果</div>
        <div class="result-item">
            <span>推斷每月薪資基數：</span>
            <span class="value" id="resBase">0 元</span>
        </div>
        <div class="result-item">
            <span>其中本薪金額：</span>
            <span class="value" id="resBasicSalary">0 元</span>
        </div>
        <div class="result-item">
            <span>其中伙食費金額：</span>
            <span class="value" id="resFood">0 元</span>
        </div>
        <hr>
        <div class="result-item">
            <span>推算平日每小時工資 (時薪)：</span>
            <span class="value" id="resHourly">0 元</span>
        </div>
        <div class="result-item">
            <span>實際當月出勤天數：</span>
            <span class="value" id="resWorkDays">0 天</span>
        </div>
        <div class="result-item">
            <span>少休天數加班費 (休息日)：</span>
            <span class="value" id="resLeaveOvertime">0 元</span>
        </div>
        <div class="result-item">
            <span>提前上班總加班費：</span>
            <span class="value" id="resEarlyOvertime">0 元</span>
        </div>
        <hr>
        <div class="result-item">
            <span>少休加班時數：</span>
            <span class="value" id="resLeaveHours">0 小時</span>
        </div>
        <div class="result-item">
            <span>提前上班總時數：</span>
            <span class="value" id="resEarlyHours">0 小時</span>
        </div>
        <div class="result-item" style="font-weight: bold;">
            <span>全月總加班工時：</span>
            <span class="value" id="resTotalOvertimeHours" style="color: var(--primary);">0 小時</span>
        </div>
    </div>
</div>

<script>
function calculateSalary() {
    const totalEarn = parseFloat(document.getElementById('totalEarn').value);
    const monthDays = parseInt(document.getElementById('monthDays').value);
    const foodSubsidy = parseFloat(document.getElementById('foodSubsidy').value) || 0;
    const leaveDays = parseInt(document.getElementById('leaveDays').value);
    const earlyMins = parseFloat(document.getElementById('earlyMins').value) || 0;

    if (isNaN(totalEarn) || totalEarn <= 0) {
        alert('請輸入正確的每月應領總金額！');
        return;
    }
    if (leaveDays < 4 || leaveDays > 8) {
        alert('休假天數限制在 4 到 8 天之間！');
        return;
    }

    const standardLeaveDays = 8;
    const actualWorkDays = monthDays - leaveDays; 
    const overtimeDays = standardLeaveDays - leaveDays; 

    const earlyHoursPerDay = earlyMins / 60;
    const totalEarlyHours = actualWorkDays * earlyHoursPerDay; 
    const totalLeaveOvertimeHours = overtimeDays * 8; 
    const totalOvertimeHours = totalEarlyHours + totalLeaveOvertimeHours;

    const hourlyDivisor = 240; 
    const restDayWeight = (2 * 1.34) + (6 * 1.67);
    const earlyWeight = 1.34;

    const multiplier = 1 + ((totalEarlyHours * earlyWeight) + (overtimeDays * restDayWeight)) / hourlyDivisor;
    
    const salaryBase = Math.round(totalEarn / multiplier);
    const hourlyWage = salaryBase / hourlyDivisor;

    const earlyOvertimePay = Math.round(totalEarlyHours * earlyWeight * hourlyWage);
    const leaveOvertimePay = Math.round(overtimeDays * restDayWeight * hourlyWage);
    const basicSalary = salaryBase - foodSubsidy;

    document.getElementById('resBase').innerText = salaryBase.toLocaleString() + ' 元';
    document.getElementById('resBasicSalary').innerText = (basicSalary < 0 ? 0 : basicSalary).toLocaleString() + ' 元';
    document.getElementById('resFood').innerText = foodSubsidy.toLocaleString() + ' 元';
    document.getElementById('resHourly').innerText = hourlyWage.toFixed(2) + ' 元';
    document.getElementById('resWorkDays').innerText = actualWorkDays + ' 天';
    document.getElementById('resLeaveOvertime').innerText = leaveOvertimePay.toLocaleString() + ' 元';
    document.getElementById('resEarlyOvertime').innerText = earlyOvertimePay.toLocaleString() + ' 元';
    
    document.getElementById('resLeaveHours').innerText = totalLeaveOvertimeHours.toFixed(1) + ' 小時';
    document.getElementById('resEarlyHours').innerText = totalEarlyHours.toFixed(1) + ' 小時';
    document.getElementById('resTotalOvertimeHours').innerText = totalOvertimeHours.toFixed(1) + ' 小時';

    const alertBox = document.getElementById('alertBox');
    if (totalOvertimeHours > 46) {
        alertBox.className = "alert-box alert-danger";
        alertBox.innerHTML = `⚠️ 警告：當月總加班時數已達 <strong>${totalOvertimeHours.toFixed(1)}</strong> 小時，已超過勞基法規定的每月 <strong>46</strong> 小時上限！`;
        alertBox.style.display = "block";
    } else {
        alertBox.className = "alert-box alert-success";
        alertBox.innerHTML = `✅ 合法：全月總加班時數為 <strong>${totalOvertimeHours.toFixed(1)}</strong> 小時，符合勞基法工時上限。`;
        alertBox.style.display = "block";
    }

    document.getElementById('resultBox').style.display = "block";
}
</script>

</body>
</html>
